name: Build, install and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-1.95-${{ hashFiles('Cargo.lock') }}
      - name: Formatting and Rust regression
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verified Inno Setup compiler
        run: ./scripts/install-inno.ps1
      - name: Self-contained static-CRT installer
        run: ./scripts/package-windows.ps1
      - name: Real per-user install, repair and uninstall
        run: ./scripts/verify-windows-install.ps1 -Installer (Get-ChildItem dist/windows/*-setup.exe | Select-Object -First 1).FullName -OutputDirectory artifacts/windows-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist/windows/*.exe
            dist/windows/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-windows
          path: artifacts/windows-install
          if-no-files-found: warn

  macos:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust and universal targets
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup target add --toolchain 1.95.0 aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-rust-1.95-${{ hashFiles('Cargo.lock') }}
      - name: Formatting and native Rust regression
        run: |
          cargo fmt --all -- --check
          cargo test --release --locked
      - name: Universal app and ad-hoc DMG
        run: bash scripts/package-macos.sh
      - name: Detached copied-app runtime and native lifecycle
        run: |
          DMG=(dist/macos/*.dmg)
          bash scripts/verify-macos.sh "${DMG[0]}" artifacts/macos-arm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-macos-arm
          path: artifacts/macos-arm
          if-no-files-found: warn

  macos-intel:
    needs: macos
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos
          path: dist/macos
      - name: Native Intel runtime of the same universal DMG
        run: |
          DMG=(dist/macos/*.dmg)
          bash scripts/verify-macos.sh "${DMG[0]}" artifacts/macos-intel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-macos-intel
          path: artifacts/macos-intel
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist/publish
          merge-multiple: true
      - name: Verify version and checksums
        run: |
          VERSION=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          cd dist/publish
          sha256sum --check *.sha256
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/publish/*.exe dist/publish/*.dmg dist/publish/*.sha256 --verify-tag --prerelease --title "Image Feedback $GITHUB_REF_NAME" --notes-file packaging/release-notes.md
